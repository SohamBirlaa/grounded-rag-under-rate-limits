[project]
name = "the-relay"
version = "0.1.0"
description = "The Relay — LLM Inference Reliability & RAG Evaluation Pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
